version: "2"
linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - unconvert
  settings:
    errcheck:
      exclude-functions:
        - (net/http.ResponseWriter).Write
        - io.Copy
        - io.WriteString
        - crypto/rand.Read
    gosec:
      excludes:
        - G104 # errcheck ile çakışıyor
  exclusions:
    rules:
      - path: _test\.go
        linters: [errcheck, gosec]
