<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go Payment Gateway</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { background-color: #1e293b; border: 1px solid #334155; border-radius: 12px; }
        .btn-primary { background-color: #6366f1; border: none; }
        .btn-primary:hover { background-color: #4f46e5; }
        .btn-success { background-color: #10b981; border: none; }
        .btn-success:hover { background-color: #059669; }
        .form-control, .form-control:focus { background-color: #0f172a; border: 1px solid #334155; color: #f8fafc; }
        .table-dark { background-color: #1e293b; color: #f8fafc; }
    </style>
</head>
<body class="py-5">

    <div class="container" style="max-width: 900px;">
        
        <div class="text-center mb-4">
            <h2 class="fw-bold text-indigo-400">🚀 Go Payment Gateway</h2>
            <p class="text-muted small">JWT Güvenlikli & SQL İşlem Loglamalı Microservice</p>
        </div>


        <div id="loginCard" class="card p-4 shadow-lg mx-auto" style="max-width: 450px;">
            <h4 class="mb-3">Kullanıcı Girişi</h4>
            <div class="mb-3">
                <label class="form-label">E-Posta</label>
                <input type="email" id="emailInput" class="form-control" value="enes@test.com">
            </div>
            <div class="mb-3">
                <label class="form-label">Şifre</label>
                <input type="password" id="passInput" class="form-control" value="123456">
            </div>
            <button onclick="login()" class="btn btn-primary w-100 py-2 fw-bold">Giriş Yap & Token Al</button>
            <div id="loginAlert" class="mt-3 alert d-none small" role="alert"></div>
        </div>


        <div id="mainPanel" class="row g-4 d-none">
  
            <div class="col-md-6">

                <div class="card p-4 shadow-lg mb-4">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="m-0">💳 Ödeme Yap</h5>
                        <span class="badge bg-success">JWT Aktif 🔑</span>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Kart Numarası</label>
                        <input type="text" id="kartNoInput" class="form-control" value="9999-8888">
                    </div>
                    <div class="row">
                        <div class="col-6 mb-3">
                            <label class="form-label">Mevcut Bakiye</label>
                            <input type="number" id="bakiyeInput" class="form-control" value="1000">
                        </div>
                        <div class="col-6 mb-3">
                            <label class="form-label">Tutar</label>
                            <input type="number" id="tutarInput" class="form-control" value="250">
                        </div>
                    </div>
                    <button onclick="odemeYap()" class="btn btn-success w-100 py-2 fw-bold">Ödemeyi Onayla</button>
                    <div id="payAlert" class="mt-3 alert d-none small" role="alert"></div>
                </div>


                <div class="card p-4 shadow-lg">
                    <h5 class="mb-2">📦 Toplu Kart Yükle (Batch)</h5>
                    <p class="text-muted small mb-2">JSON formatında toplu kart verisi ekleyin:</p>
                    <textarea id="batchJsonInput" class="form-control mb-3" rows="3">[{"kart_no":"1111-2222","bakiye":1500},{"kart_no":"3333-4444","bakiye":2000}]</textarea>
                    <button onclick="topluKartEkle()" class="btn btn-outline-info w-100 fw-bold">Toplu Kartları İçeri Aktar</button>
                    <div id="batchAlert" class="mt-2 alert d-none small" role="alert"></div>
                </div>
            </div>


            <div class="col-md-6">
                <div class="card p-4 shadow-lg h-100">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="m-0">📜 Son İşlem Logları</h5>
                        <button onclick="islemleriGetir()" class="btn btn-sm btn-outline-light">Yenile 🔄</button>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-dark table-hover small text-center align-middle">
                            <thead>
                                <tr>
                                    <th>Kart</th>
                                    <th>Tutar</th>
                                    <th>Durum</th>
                                </tr>
                            </thead>
                            <tbody id="transactionsTable">
                                <tr><td colspan="3" class="text-muted">Henüz işlem yapılmadı</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let jwtToken = "";

        async function login() {
            const eposta = document.getElementById('emailInput').value;
            const sifre = document.getElementById('passInput').value;
            const alertBox = document.getElementById('loginAlert');

            try {
                const response = await fetch('/api/v1/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ eposta, sifre })
                });

                const data = await response.json();

                if (data.basarili) {
                    jwtToken = data.token;
                    alertBox.className = "mt-3 alert alert-success";
                    alertBox.innerText = "Giriş başarılı!";
                    alertBox.classList.remove('d-none');

                    setTimeout(() => {
                        document.getElementById('loginCard').classList.add('d-none');
                        document.getElementById('mainPanel').classList.remove('d-none');
                        islemleriGetir();
                    }, 800);
                } else {
                    alertBox.className = "mt-3 alert alert-danger";
                    alertBox.innerText = data.mesaj || "Giriş başarısız!";
                    alertBox.classList.remove('d-none');
                }
            } catch (err) {
                alertBox.className = "mt-3 alert alert-danger";
                alertBox.innerText = "Sunucuya bağlanılamadı!";
                alertBox.classList.remove('d-none');
            }
        }

        async function odemeYap() {
            const kart_no = document.getElementById('kartNoInput').value;
            const bakiye = parseFloat(document.getElementById('bakiyeInput').value);
            const tutar = parseFloat(document.getElementById('tutarInput').value);
            const alertBox = document.getElementById('payAlert');

            try {
                const response = await fetch('/api/v1/pay', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + jwtToken
                    },
                    body: JSON.stringify({ kart_no, bakiye, tutar })
                });

                const data = await response.json();

                if (data.basarili) {
                    alertBox.className = "mt-3 alert alert-success";
                    alertBox.innerText = `✅ ${data.mesaj}`;
                    alertBox.classList.remove('d-none');
                    document.getElementById('bakiyeInput').value = data.kalan_bakiye;
                } else {
                    alertBox.className = "mt-3 alert alert-danger";
                    alertBox.innerText = `❌ ${data.mesaj}`;
                    alertBox.classList.remove('d-none');
                }
                islemleriGetir();
            } catch (err) {
                alertBox.className = "mt-3 alert alert-danger";
                alertBox.innerText = "İşlem hatası!";
                alertBox.classList.remove('d-none');
            }
        }

    async function islemleriGetir() {
    const tbody = document.getElementById('transactionsTable');
 
    tbody.innerHTML = `<tr><td colspan="3" class="text-muted">Yükleniyor...</td></tr>`;

    try {
        const response = await fetch('/api/v1/transactions', {
            method: 'GET',
            headers: { 
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + jwtToken 
            }
        });

        if (!response.ok) {
            throw new Error("İşlem geçmişi alınamadı");
        }

        const data = await response.json();
        tbody.innerHTML = "";

        if (!data || data.length === 0) {
            tbody.innerHTML = `<tr><td colspan="3" class="text-muted">Henüz işlem geçmişi yok</td></tr>`;
            return;
        }

        data.forEach(item => {
            const badgeClass = item.durum === "Başarılı" ? "bg-success" : "bg-danger";
            tbody.innerHTML += `
                <tr>
                    <td><strong>${item.kart_no}</strong></td>
                    <td>${item.tutar} TL</td>
                    <td><span class="badge ${badgeClass}">${item.durum}</span></td>
                </tr>
            `;
        });
    } catch (err) {
        console.error("Hata:", err);
        tbody.innerHTML = `<tr><td colspan="3" class="text-danger">Veri çekilemedi!</td></tr>`;
    }
}

        async function topluKartEkle() {
            const rawJson = document.getElementById('batchJsonInput').value;
            const alertBox = document.getElementById('batchAlert');

            try {
                const response = await fetch('/api/v1/cards/batch', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + jwtToken
                    },
                    body: rawJson
                });
                const data = await response.json();

                if (data.basarili) {
                    alertBox.className = "mt-2 alert alert-success";
                    alertBox.innerText = data.mesaj;
                    alertBox.classList.remove('d-none');
                } else {
                    alertBox.className = "mt-2 alert alert-danger";
                    alertBox.innerText = "Yükleme başarısız!";
                    alertBox.classList.remove('d-none');
                }
            } catch (err) {
                alertBox.className = "mt-2 alert alert-danger";
                alertBox.innerText = "JSON formatı hatalı!";
                alertBox.classList.remove('d-none');
            }
        }
    </script>
</body>
</html>
