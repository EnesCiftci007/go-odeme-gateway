name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Testler (${{ matrix.db }})
        env:
          TEST_DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgres://test:test@localhost:5432/test?sslmode=disable' || '' }}
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: Kapsam
        run: go tool cover -func=coverage.out | tail -1

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v5
      - name: Docker imajını derle
        run: docker build -t go-odeme-gateway:ci .
      - name: Duman testi
        run: |
          docker run -d --name app -p 8080:8080 \
            -e JWT_SECRET=ci-icin-en-az-otuz-iki-karakterlik-anahtar \
            -e ADMIN_EMAIL=admin@ci.test -e ADMIN_PASSWORD=ci-sifre-123 \
            go-odeme-gateway:ci
          for i in $(seq 1 20); do curl -fs localhost:8080/readyz && break; sleep 1; done
          curl -fs localhost:8080/readyz
          curl -fs -X POST localhost:8080/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"eposta":"admin@ci.test","sifre":"ci-sifre-123"}' | grep -q '"token"'
          docker logs app
